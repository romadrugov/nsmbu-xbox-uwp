name: Xbox Private Recomp Preparation Tool

on:
  push:
    branches: [xbox-uwp]
    paths:
      - "tools/xbox/private_gamecode.py"
      - "tools/xbox/private_compile_one.py"
      - "tools/xbox/test_private_gamecode.py"
      - "tools/xbox/test_private_compile_one.py"
      - "recomp/android_fixture.py"
      - ".github/workflows/xbox-private-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-fixture-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test local-only metadata and repository privacy guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/xbox -p 'test_private_*.py' -v
      - name: Run real recompiler on PUBLIC three-instruction PowerPC fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 recomp/android_fixture.py --output "$RUNNER_TEMP/public-ppc"
          python3 tools/xbox/private_gamecode.py inspect \
            --generated "$RUNNER_TEMP/public-ppc/gen" \
            --summary "$RUNNER_TEMP/public-summary.json"
          python3 - "$RUNNER_TEMP/public-summary.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              m = json.load(stream)
          assert m["entry_point"] == "0x02000000", m
          assert m["function_count"] == 1, m
          assert m["import_count"] == 0, m
          assert m["code_files"] >= 1, m
          assert m["build"] == "UNVERIFIED", m
          assert not m["build_verified_by_sha256"], m
          assert not m["native_xbox_linked"], m
          assert not m["game_code_executed_on_xbox"], m
          print("Public synthetic recomp inventory PASSED; no Nintendo code used")
          PY


  public-fixture-windows-coff:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile ONLY public synthetic PowerPC recompiler output to Windows x64 COFF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "nsmbu-synthetic-coff"
          py -3 recomp/android_fixture.py --output $root
          if ($LASTEXITCODE -ne 0) { throw "Public RPX generation failed" }
          $generated = Join-Path $root "gen"
          $out = Join-Path $env:RUNNER_TEMP "nsmbu-synthetic-object"
          py -3 tools/xbox/private_compile_one.py compile --public-fixture --generated $generated --out $out
          if ($LASTEXITCODE -ne 0) { throw "Public Windows AMD64 COFF probe failed" }
          $report = Get-Content (Join-Path $out "compile-summary.json") -Raw | ConvertFrom-Json
          if ($report.coff_machine -ne "0x8664" -or
              $report.build -ne "PUBLIC_FIXTURE" -or
              $report.native_xbox_linked -or
              $report.game_code_executed_on_xbox) {
            throw "Unverified COFF probe report"
          }
          Write-Host "PUBLIC fixture -> clang-cl -> AMD64 COFF PASSED (not linked to Xbox)"
          # Deliberately NO upload-artifact: objects and compiler logs remain local to runner.
