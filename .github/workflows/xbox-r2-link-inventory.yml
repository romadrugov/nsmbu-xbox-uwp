name: NSMBU Xbox - R2 production dispatch host test

on:
  push:
    branches: [xbox-r2-production-dispatch-probe]
    paths:
      - ".github/workflows/xbox-r2-link-inventory.yml"
      - "xbox/runtime-compat/**"
      - "runtime/src/core/core.cpp"
      - "runtime/src/core/write_watch.cpp"
      - "runtime/src/hle/coreinit_mem.cpp"
      - "runtime/include/recomp_table.h"
      - "recomp/android_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dispatch-host-test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Link and execute genuine core dispatcher, Cafe OS HLE, and public recompiled guest
        shell: pwsh
        run: ./xbox/runtime-compat/test-r2-production-dispatch.ps1
