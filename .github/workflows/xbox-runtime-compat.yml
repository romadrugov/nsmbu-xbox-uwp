name: NSMBU Xbox - Upstream Runtime UWP Compile Gate

on:
  push:
    branches: [xbox-uwp]
    paths:
      - "xbox/runtime-compat/**"
      - "runtime/src/core/env.cpp"
      - "runtime/src/core/env.h"
      - "runtime/src/hle/**"
      - "runtime/src/core/threads.cpp"
      - "runtime/src/core/core.cpp"
      - "runtime/src/platform/**"
      - "runtime/src/mods/**"
      - "runtime/src/input/**"
      - "runtime/include/ppc.h"
      - ".github/workflows/xbox-runtime-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-uwp-staticlib:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile real upstream core/env.cpp under Windows Store x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio missing' }
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits/10'
          $versions = @(Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
            Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'Windows SDK missing' }
          $sdk = $versions[0].Name
          $project = 'xbox/runtime-compat/NSMBURuntimeCompat.vcxproj'
          & $msbuild $project '/t:Build' '/m' '/v:minimal' '/p:Configuration=Release' '/p:Platform=x64' "/p:WindowsTargetPlatformVersion=$sdk"
          if ($LASTEXITCODE -ne 0) { throw "Upstream UWP compile failed: $LASTEXITCODE" }
          $lib = Get-ChildItem 'xbox/runtime-compat' -Filter 'NSMBURuntimeCompat.lib' -Recurse -File | Select-Object -First 1
          if (-not $lib) { throw 'Compile-only runtime library not produced' }
          Write-Host "R1 compile-only PASS: real upstream core/env.cpp -> Windows Store x64 static library ($($lib.Length) bytes)"
          Write-Host 'NOT a game binary; NOT linked to UWP executable; NO Nintendo data.'

      - name: Link real upstream env library into synthetic UWP executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio not installed' }
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $msvc = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $msvc) { throw 'MSVC not installed' }
          $dumpbin = Join-Path $msvc.FullName 'bin/Hostx64/x64/dumpbin.exe'
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits/10'
          $sdk = (Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1).Name
          if (-not $sdk) { throw 'Windows SDK not found' }

          $base = Get-ChildItem 'xbox/runtime-compat' -Filter 'NSMBURuntimeCompat.lib' -Recurse -File | Select-Object -First 1
          if (-not $base) { throw 'Upstream static library missing' }
          Copy-Item $base.FullName 'xbox/runtime-compat/NSMBURuntimeCompat.lib' -Force

          & py -3 'xbox/smoke/make_assets.py'
          if ($LASTEXITCODE -ne 0) { throw 'Public PNG asset generation failed' }

          $project = 'xbox/runtime-compat/NSMBURuntimeLinkProbe.vcxproj'
          & $msbuild $project '/t:Build' '/m' '/v:minimal' '/p:Configuration=Release' '/p:Platform=x64' "/p:WindowsTargetPlatformVersion=$sdk" '/p:GenerateAppxPackageOnBuild=false' '/p:AppxPackageSigningEnabled=false'
          if ($LASTEXITCODE -ne 0) { throw 'UWP executable link failed' }

          $exe = Get-ChildItem 'xbox/runtime-compat' -Filter 'NSMBURuntimeLinkProbe.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'UWP executable missing' }
          $headers = & $dumpbin /headers $exe.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($headers -notmatch 'machine \(x64\)') { throw 'Executable not x64' }
          Write-Host "R1-to-R2 UWP executable link PASS: $($exe.Name), $($exe.Length) bytes, with upstream env library"
          Write-Host ($headers -split '\r?\n' | Where-Object { $_ -match 'machine \(x64\)|subsystem|App container' } | Select-Object -First 8)
          Write-Host 'This is a public synthetic link check, not an Xbox game or deployable AppX. No Nintendo data.'


      - name: Compile actual upstream Cafe OS memory HLE with standalone clang-cl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangOptions = @(
            (Get-Command clang-cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            'C:\Program Files\LLVM\bin\clang-cl.exe'
          )
          $clang = $clangOptions | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $clang) { throw 'clang-cl missing for upstream PowerPC builtin syntax' }
          $root = (Resolve-Path .).Path
          $out = Join-Path $env:RUNNER_TEMP 'coreinit_mem_uwp_compat.obj'
          $source = Join-Path $root 'runtime/src/hle/coreinit_mem.cpp'
          & $clang /nologo /c /O1 /MD /EHsc /clang:-std=c++17 '/DWINAPI_FAMILY=WINAPI_FAMILY_APP' "/I$(Join-Path $root 'runtime/src')" "/I$(Join-Path $root 'runtime/include')" "/Fo$out" $source
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            throw 'Upstream memory HLE source does not yet compile with clang-cl'
          }
          Write-Host "R1 clang-cl source compile PASS: coreinit_mem.cpp ($((Get-Item $out).Length) bytes)"
          Write-Host 'Source-only check, no game or Xbox executable linked.'

          # No upload-artifact: this is a public source compatibility check.

      - name: Prepare zlib UWP development headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path (Join-Path $root 'vcpkg.exe'))) { $root = 'C:\vcpkg' }
          $vcpkg = Join-Path $root 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg not installed at $root" }
          & $vcpkg install zlib:x64-uwp --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg zlib:x64-uwp install failed' }
          $include = Join-Path $root 'installed/x64-uwp/include'
          if (-not (Test-Path (Join-Path $include 'zlib.h'))) { throw 'UWP zlib.h missing after install' }
          "NSMBU_UWP_ZLIB_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'UWP zlib headers available from vcpkg; compile-only, no link.'

      - name: Probe additional real upstream HLE, FS, audio and scheduling files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangOptions = @(
            (Get-Command clang-cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            'C:\Program Files\LLVM\bin\clang-cl.exe'
          )
          $clang = $clangOptions | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $clang) { throw 'clang-cl missing' }
          $root = (Resolve-Path .).Path
          $files = @(
            'runtime/src/hle/fs.cpp',
            'runtime/src/hle/padscore.cpp',
            'runtime/src/hle/ax.cpp',
            'runtime/src/core/threads.cpp',
            'runtime/src/hle/coreinit_misc.cpp',
            'runtime/src/hle/erreula.cpp',
            'runtime/src/hle/snd_user.cpp',
            'runtime/src/hle/swkbd.cpp',
            'runtime/src/hle/system_stubs.cpp',
            'runtime/src/hle/zlib_hle.cpp',
            'runtime/src/core/core.cpp'
          )
          $failed = @()
          foreach ($relative in $files) {
            $source = Join-Path $root $relative
            $stem = [IO.Path]::GetFileNameWithoutExtension($source)
            $out = Join-Path $env:RUNNER_TEMP "nsmbu_r1_$stem.obj"
            Write-Host "=== $relative ==="
            & $clang /nologo /c /O1 /MD /EHsc /clang:-std=c++20 '/DWINAPI_FAMILY=WINAPI_FAMILY_APP' '/DNSMBU_XBOX_UWP=1' '/D_CRT_SECURE_NO_WARNINGS' "/I$(Join-Path $root 'runtime/src')" "/I$(Join-Path $root 'runtime/include')" "/I$env:NSMBU_UWP_ZLIB_INCLUDE" "/Fo$out" $source
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
              $failed += $relative
              Write-Host "FAIL: $relative"
            } else {
              Write-Host "PASS: $relative ($((Get-Item $out).Length) bytes COFF)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "R1 blockers: $($failed -join ', ')"
            throw "$($failed.Count) upstream sources did not compile for Windows APP-family"
          }
          Write-Host "All additional upstream sources compiled as x64 COFF objects."

      - name: Archive real upstream runtime COFF objects with MSVC librarian
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio missing' }
          $msvc = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $msvc) { throw 'MSVC tools missing' }
          $libexe = Join-Path $msvc.FullName 'bin/Hostx64/x64/lib.exe'
          if (-not (Test-Path $libexe)) { throw 'MSVC librarian missing' }
          $envlib = Get-ChildItem 'xbox/runtime-compat' -Filter 'NSMBURuntimeCompat.lib' -Recurse -File | Select-Object -First 1
          if (-not $envlib) { throw 'Base UWP environment library missing' }
          $obj = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'nsmbu_r1_*.obj' -File)
          $heap = Join-Path $env:RUNNER_TEMP 'coreinit_mem_uwp_compat.obj'
          if (-not (Test-Path $heap)) { throw 'Heap HLE object missing' }
          if ($obj.Count -ne 11) { throw "Expected 11 additional upstream COFF objects, got $($obj.Count)" }
          $all = @($envlib.FullName, $heap) + @($obj | ForEach-Object { $_.FullName })
          $out = Join-Path $env:RUNNER_TEMP 'nsmbu_upstream_uwp_compat.lib'
          & $libexe /nologo '/MACHINE:X64' "/OUT:$out" @all
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'MSVC archive of upstream sources failed' }
          $bytes = (Get-Item $out).Length
          if ($bytes -lt 100000) { throw "Unexpectedly small runtime archive: $bytes" }
          Write-Host "R1 archive PASS: 13 upstream translation units, Windows AMD64 static library ($bytes bytes)."
          Write-Host 'Object archive only: no UWP executable, no link resolution, no private game code.'
          # Private Nintendo RPX/generated objects are never part of this public CI.


      - name: Inspect UWP executable imports and core runtime linkage dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          $msvc = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $dumpbin = Join-Path $msvc.FullName 'bin/Hostx64/x64/dumpbin.exe'
          $exe = Get-ChildItem 'xbox/runtime-compat' -Filter 'NSMBURuntimeLinkProbe.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'No UWP link probe exe to audit' }

          Write-Host '==== Public UWP executable imported DLLs ===='
          & $dumpbin /dependents $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Executable dependency inspection failed' }

          Write-Host '==== Real upstream core/HLE undefined external symbols (pre-link) ===='
          $paths = @(
            (Join-Path $env:RUNNER_TEMP 'coreinit_mem_uwp_compat.obj'),
            (Join-Path $env:RUNNER_TEMP 'nsmbu_r1_threads.obj'),
            (Join-Path $env:RUNNER_TEMP 'nsmbu_r1_core.obj'),
            (Join-Path $env:RUNNER_TEMP 'nsmbu_r1_fs.obj')
          )
          foreach ($obj in $paths) {
            if (-not (Test-Path $obj)) { throw "Expected upstream object missing: $obj" }
            $symbolLines = @(& $dumpbin /symbols $obj)
            if ($LASTEXITCODE -ne 0) { throw "COFF symbol inspection failed: $obj" }
            $undefined = @($symbolLines | Where-Object { $_ -match '\bUNDEF\b.+\bExternal\s+\|' })
            $defined = @($symbolLines | Where-Object { $_ -match '\bSECT[0-9A-F]+\b.+\bExternal\s+\|' })
            Write-Host "$([IO.Path]::GetFileName($obj)): defined=$($defined.Count), undefined=$($undefined.Count)"
            Write-Host ($undefined | Select-Object -First 8)
          }
          Write-Host 'Counts are unresolved before full linking; they are not necessarily missing implementations.'


      - name: Link real clang-cl Cafe OS HLE with UWP executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clangOptions = @(
            (Get-Command clang-cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            'C:\Program Files\LLVM\bin\clang-cl.exe'
          )
          $clang = $clangOptions | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $clang) { throw 'clang-cl compiler missing' }
          $root = (Resolve-Path .).Path
          $dir = Join-Path $root 'xbox/runtime-compat'
          $hle = Join-Path $env:RUNNER_TEMP 'coreinit_mem_uwp_compat.obj'
          if (-not (Test-Path $hle)) { throw 'Real upstream HLE object not compiled' }
          Copy-Item $hle (Join-Path $dir 'coreinit_mem_uwp_compat.obj') -Force
          $bridge = Join-Path $dir 'hle_link_probe.obj'
          & $clang /nologo /c /O1 /MD /EHsc /clang:-std=c++17 '/DWINAPI_FAMILY=WINAPI_FAMILY_APP' "/I$(Join-Path $root 'runtime/src')" "/I$(Join-Path $root 'runtime/include')" "/Fo$bridge" (Join-Path $dir 'hle_link_probe.cpp')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bridge)) { throw 'HLE ABI bridge compile failed' }

          $hostShim = Join-Path $dir 'hle_link_host.obj'
          & $clang /nologo /c /O1 /MD /EHsc /clang:-std=c++17 '/DWINAPI_FAMILY=WINAPI_FAMILY_APP' "/I$(Join-Path $root 'runtime/src')" "/I$(Join-Path $root 'runtime/include')" "/Fo$hostShim" (Join-Path $dir 'hle_link_host.cpp')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $hostShim)) { throw 'Isolated HLE host adapter compile failed' }

          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits/10'
          $sdk = (Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (-not $sdk) { throw 'Windows SDK not found' }
          $project = Join-Path $dir 'NSMBURuntimeHleLinkProbe.vcxproj'
          & $msbuild $project '/t:Build' '/m' '/v:minimal' '/p:Configuration=Release' '/p:Platform=x64' "/p:WindowsTargetPlatformVersion=$sdk" '/p:GenerateAppxPackageOnBuild=false' '/p:AppxPackageSigningEnabled=false'
          if ($LASTEXITCODE -ne 0) { throw 'Real HLE UWP executable link failed; inspect LNK errors above' }
          $exe = Get-ChildItem $dir -Filter 'NSMBURuntimeHleLinkProbe.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'HLE UWP executable not produced' }
          Write-Host "R2 real Cafe OS HLE UWP link PASS ($($exe.Length) bytes), clang-cl + MSVC"
          Write-Host 'Link check ONLY: no Nintendo code, no Xbox execution or full runtime initialization.'


      - name: Execute public Cafe OS HLE heap roundtrip on Windows CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $msvc = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $dumpbin = Join-Path $msvc.FullName 'bin/Hostx64/x64/dumpbin.exe'
          $dir = (Resolve-Path 'xbox/runtime-compat').Path

          $uwp = Get-ChildItem $dir -Filter 'NSMBURuntimeHleLinkProbe.exe' -Recurse -File | Select-Object -First 1
          if (-not $uwp) { throw 'UWP HLE link output missing' }
          $headers = (& $dumpbin /headers $uwp.FullName | Out-String)
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch 'machine \(x64\)' -or $headers -notmatch 'App Container') {
            throw 'Real HLE UWP output lacks x64/AppContainer PE flags'
          }
          $depends = (& $dumpbin /dependents $uwp.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Real HLE UWP dependency audit failed' }
          if ($depends -match '(?im)^\s+(?:USER32|MSVCP140|VCRUNTIME140|KERNEL32)\.dll\s*$') {
            throw 'Desktop-only dependency in UWP HLE link probe'
          }
          Write-Host 'PASS: real Cafe OS HLE UWP PE is x64 AppContainer with no obvious desktop CRT imports.'
          Write-Host $depends

          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits/10'
          $sdk = (Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (-not $sdk) { throw 'Windows SDK missing for host test' }
          $project = Join-Path $dir 'NSMBURuntimeHleHostTest.vcxproj'
          & $msbuild $project '/t:Build' '/m' '/v:minimal' '/p:Configuration=Release' '/p:Platform=x64' "/p:WindowsTargetPlatformVersion=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Real HLE desktop behavioral test link failed' }
          $exe = Get-ChildItem $dir -Filter 'NSMBURuntimeHleHostTest.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Real HLE desktop test executable missing' }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Real Cafe OS heap HLE failed behavior test (code=$LASTEXITCODE)" }
          Write-Host 'PASS: same upstream Cafe OS HLE object executed synthetic guest heap lifecycle on Windows.'
