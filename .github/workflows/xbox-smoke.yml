name: NSMBU Xbox - render Backend Dispatch Probe

on:
  push:
    branches: [xbox-uwp]
    paths:
      - "xbox/**"
      - "runtime/src/gfx/d3d12/gx2_detile.*"
      - "runtime/test/gx2_detile_test.cpp"
      - "runtime/src/gfx/d3d12/gx2_macro_detile.*"
      - "runtime/test/gx2_macro_detile_test.cpp"
      - "runtime/src/gfx/renderer.h"
      - "runtime/src/gfx/renderer.cpp"
      - "runtime/src/gfx/d3d12/backend_probe.*"
      - "runtime/test/d3d12_backend_probe_test.cpp"
      - ".github/workflows/xbox-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detile-cpu-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile pure C++ GX2 detile unit tests
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I runtime/src \
            runtime/src/gfx/d3d12/gx2_detile.cpp \
            runtime/test/gx2_detile_test.cpp \
            -o /tmp/gx2_detile_test
          /tmp/gx2_detile_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I runtime/src \
            runtime/src/gfx/d3d12/gx2_macro_detile.cpp \
            runtime/test/gx2_macro_detile_test.cpp \
            -o /tmp/gx2_macro_detile_test
          /tmp/gx2_macro_detile_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I runtime/src \
            runtime/src/gfx/d3d12/backend_probe.cpp \
            runtime/test/d3d12_backend_probe_test.cpp \
            -o /tmp/d3d12_backend_probe_test
          /tmp/d3d12_backend_probe_test
  smoke:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build signed Xbox UWP test package
        shell: pwsh
        run: ./xbox/smoke/build-ci.ps1
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: nsmbu-xbox-smoke
          path: |
            xbox/smoke/output/NSMBUXboxSmoke_0.3.0.0_x64.appx
            xbox/smoke/output/NSMBUXboxSmoke.cer
            xbox/smoke/output/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 7
